[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NoteBook"
version = "0.1.0"
description = "A short description of my project"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Jane Doe", email = "jane@example.com" }
]
dependencies = [
    "requests>=2.28.0",
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[project.scripts]
nb = "src.main:app"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]